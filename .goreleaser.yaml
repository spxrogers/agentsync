# goreleaser v2 config (the CI action installs a pinned v2 release — see release.yml).
version: 2

project_name: agentsync

# Make a re-run idempotent. The whole release ships in one job (see release.yml),
# so re-running the workflow is the recovery path if any single publisher hiccups
# (e.g. a flaky `choco push`) after the Release + archives were already uploaded.
# `replace_existing_artifacts` overwrites the existing assets on the second pass
# instead of erroring on "asset already exists"; release.mode defaults to
# keep-existing, so the existing Release itself is left intact. (Overwrite is
# correct whether or not the re-cut bytes match — and they only partly do: the
# binaries and the tar.gz/zip archives are byte-identical run-to-run, but the
# nfpms deb/rpm — and therefore checksums.txt, which hashes them — are NOT.
# Empirically verified by diffing two snapshot releases in issue #173; see the
# `checksum` block below for the attribution.)
release:
  replace_existing_artifacts: true

builds:
  - id: agentsync
    main: ./cmd/agentsync
    binary: agentsync
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible builds (general hygiene): -trimpath strips the per-runner
    # GOPATH/module-cache path from the binary, and the embedded date/mtime are
    # pinned to the commit rather than wall-clock build time, so a given tag
    # builds bit-for-bit identically.
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Pin every in-archive entry's mtime to the commit date (RFC3339) so re-cutting
    # a release produces byte-identical archives — empirically verified in issue #173
    # by diffing two snapshot releases: all six tar.gz/zip archives (and every
    # extracted binary) hashed identically run-to-run. goreleaser 2.16.0 has no
    # top-level archives.mtime, so the binary is pinned via builds_info.mtime and the
    # bundled docs (the same LICENSE/README/CHANGELOG set goreleaser includes by
    # default) via files[].info.mtime. The binary itself is already host-independent
    # (-trimpath + mod_timestamp above); this pins the wall-clock mtime the tar/zip
    # would otherwise stamp on each entry. PR #115 dropped this scaffolding; restored
    # here (issue #138). NOTE: this pin makes only the ARCHIVES reproducible — the
    # nfpms deb/rpm below still carry the wall-clock build time, so checksums.txt is
    # NOT byte-identical run-to-run (see the `checksum` block). The archive half of
    # the claim is guarded in code: internal/release/reproducibility_test.go.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"

# checksums.txt hashes every archive AND every nfpms deb/rpm. Issue #173 diffed two
# snapshot releases built from the same commit and found this file is NOT byte-
# identical run-to-run: the six archive lines match, but the four deb/rpm lines
# differ every run. Attribution — the packages embed the wall-clock BUILD time, not
# the commit date: the deb `data.tar` differs in exactly 4 bytes (the octal mtime of
# the synthesized `./usr` + `./usr/bin` directory entries; the packaged binary keeps
# the pinned commit mtime), and the rpm differs in ~60 header bytes (RPMTAG_BUILDTIME
# plus the signature digests over it). The compressed payloads are otherwise
# identical. Making the packages reproducible needs an `nfpms.mtime` pin — a
# behavioral change that is out of #173's (QA-only) scope and belongs with the
# archive-pinning work in #138. Because the full checksums.txt is not stable
# run-to-run, there is deliberately NO CI job diffing it across two snapshots (it
# would be permanently red); the reproducible half (archives) is guarded instead by
# internal/release/reproducibility_test.go. The two-snapshot diff itself is
# re-runnable on demand via scripts/reproducibility-diff.sh (archives fatal,
# deb/rpm/checksums.txt informational).
checksum:
  name_template: "checksums.txt"

# Sign the checksums.txt with keyless cosign (Sigstore). Artifact integrity no
# longer rests on GitHub TLS alone: consumers can verify checksums.txt against
# checksums.txt.sig + checksums.txt.pem via cosign's Rekor transparency log.
# Keyless signing introduces NO new credential/secret — it uses the release job's
# ambient OIDC token (release.yml grants `id-token: write` and installs cosign).
# `--yes` skips the interactive confirmation. This is a publish-phase action; the
# CI `--snapshot --skip=publish` run does not exercise it, but `goreleaser check`
# schema-validates the block (issue #138).
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - "sign-blob"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{.ShortCommit}}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

# Linux native packages (deb/rpm) — produced in every snapshot build.
nfpms:
  - id: linux-pkgs
    package_name: agentsync
    maintainer: spxrogers <spxrogers@users.noreply.github.com>
    homepage: https://github.com/spxrogers/agentsync
    license: MIT
    formats: [deb, rpm]
    section: utils
    description: Centrally manage AI coding-agent configurations.
    # Stable, arch-qualified, version-less asset names (e.g.
    # agentsync_linux_amd64.deb) so the README's
    # releases/latest/download/<name> URLs resolve. Without this the default
    # name carries the version, which `latest/download/` can't address.
    # .ConventionalExtension expands to .deb / .rpm per format. The coupling to
    # the README install URLs is now enforced by the "Guard nfpms
    # file_name_template matches README install URLs" step in ci.yml, so a
    # divergence fails CI instead of silently 404ing (issue #138).
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ .ConventionalExtension }}"

# --------------------------------------------------------------------------
# Homebrew — ENABLED (since v0.1.0). goreleaser's `brews` (formula) stanza is
# deprecated; we publish a *cask* of the prebuilt binary instead. On every
# tagged release it pushes Casks/agentsync.rb to the spxrogers/homebrew-tap
# repo, so `brew tap spxrogers/tap && brew install agentsync` works on macOS.
# The default Actions GITHUB_TOKEN can't write a *different* repo, so the
# release workflow supplies HOMEBREW_TAP_GITHUB_TOKEN (a token with
# contents:write on the tap). The post-install hook strips the macOS quarantine
# xattr Gatekeeper would otherwise put on the unsigned binary.
# --------------------------------------------------------------------------

homebrew_casks:
  - name: agentsync
    binaries: [agentsync]
    repository:
      owner: spxrogers
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/spxrogers/agentsync
    description: Centrally manage AI coding-agent configurations
    license: MIT
    url:
      verified: "github.com/spxrogers/agentsync/"
    commit_author:
      name: goreleaser-bot
      email: goreleaser@users.noreply.github.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentsync"]
          end

# --------------------------------------------------------------------------
# Windows — Scoop (issue #74). Writes bucket/agentsync.json into
# spxrogers/scoop-bucket on every tagged release, pointing at the Windows .zip
# already built above, so `scoop install agentsync` works. Runs from the Linux
# release job — pure Go + git, no Windows tooling. The default Actions
# GITHUB_TOKEN can't write a *second* repo, so the workflow supplies
# SCOOP_BUCKET_GITHUB_TOKEN (contents:write on the bucket) — same constraint as
# the Homebrew tap.
#
# The push token comes from SCOOP_BUCKET_GITHUB_TOKEN (a repo secret), templated
# as plain `{{ .Env.… }}` exactly like the Homebrew cask's token. NOTE: credential
# fields (repository.token, private_key) render via goreleaser's env-only context
# (ApplySingleEnvOnly) — only bare `{{ .Env.X }}` works; envOrDefault/isEnvSet are
# NOT available and fail the release at publish time (`function "envOrDefault" not
# defined`). They ARE available in full-context fields like the chocolatey api_key.
# CI guards this (see ci.yml "Guard goreleaser token…").
# --------------------------------------------------------------------------
scoops:
  - name: agentsync
    repository:
      owner: spxrogers
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    directory: bucket
    url_template: "https://github.com/spxrogers/agentsync/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: goreleaser-bot
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: https://github.com/spxrogers/agentsync
    description: Centrally manage AI coding-agent configurations.
    license: MIT

# --------------------------------------------------------------------------
# Windows — Chocolatey (issue #75). Builds the .nupkg and `choco push`es it so
# `choco install agentsync` works. goreleaser shells out to the `choco` CLI; the
# release workflow makes `choco` available on the single Linux release runner via
# Mono, so the chocolatey pipe runs in the SAME goreleaser invocation as every
# other channel. That single-run design is load-bearing: the sha256 the generated
# chocolateyinstall.ps1 checks the downloaded .zip against is computed over the
# EXACT archive this run uploads to the Release, so the two can never disagree. A
# separately-built .nupkg (a second build on another runner) is never byte-
# identical — per-runner paths, Unix file-mode bits, the zip's creator-OS byte —
# and choco verification rejects the mismatch; that two-runner split is what sank
# v0.7.1–v0.7.3, so keep choco in the one run.
#
# Gating lives in the workflow: the chocolatey pipe is skipped unless
# CHOCOLATEY_API_KEY is present — adding that secret is the whole "go live" step.
# Chocolatey's community repo runs new packages through a moderation queue, so the
# first push won't be publicly installable until it clears review.
#
# NOTE: the chocolatey pipe packages the Windows amd64 binary only — goreleaser's
# own arch filter selects amd64/386 and excludes arm64 — so the windows/arm64
# build is intentionally absent from the package.
#
# RE-ENABLED (issue #188) — the agentsync package passed Chocolatey's community
# moderation review, so `choco push` no longer 403s. It sank the tail of the
# v0.10.0 publish after every other channel had shipped, which is why the block
# was commented out for one release; it now runs like every other pipe.
# --------------------------------------------------------------------------
chocolateys:
  - name: agentsync
    ids: [default]
    title: agentsync
    authors: spxrogers
    owners: spxrogers
    summary: Centrally manage AI coding-agent configurations.
    description: |
      agentsync centrally manages AI coding-agent configurations from one
      canonical source and renders them into each agent's native config.
    project_url: https://github.com/spxrogers/agentsync
    project_source_url: https://github.com/spxrogers/agentsync
    package_source_url: https://github.com/spxrogers/agentsync
    docs_url: https://agentsync.cc/
    bug_tracker_url: https://github.com/spxrogers/agentsync/issues
    license_url: https://github.com/spxrogers/agentsync/blob/main/LICENSE
    require_license_acceptance: false
    copyright: 2026 spxrogers
    tags: "agentsync cli ai coding agents configuration claude codex cursor dotfiles"
    release_notes: "https://github.com/spxrogers/agentsync/releases/tag/{{ .Tag }}"
    url_template: "https://github.com/spxrogers/agentsync/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"
    source_repo: "https://push.chocolatey.org/"
    goamd64: v1

