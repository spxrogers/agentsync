version: "2"

run:
  timeout: 3m
  tests: true
  go: "1.26"

linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - gocritic
    - govet
    - ineffassign
    - staticcheck
  settings:
    errcheck:
      # Standard exclusions — Close on best-effort cleanup, Fprintln/Fprintf
      # to a writer in normal CLI output, etc. Genuine error sites still flag.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*net/http.Response).Body.Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.UserHomeDir$'
          msg: "use paths.HomeDir(env) so AGENTSYNC_TARGET_ROOT honored in tests"
        # Direct iox.AtomicWrite to a *destination* file (anything outside
        # ~/.agentsync) bypasses the foreign-collision backup invariant.
        # Adapters and any future code that targets a native agent location
        # (~/.claude*, ~/.config/opencode/*, etc.) must route through
        # render.Writer / adapter.DestWriter. The exclusions list below
        # whitelists callers that write to non-destination paths
        # (canonical source, agentsync's own state, plugin TOMLs).
        - pattern: '^iox\.AtomicWrite$'
          msg: "use render.Writer / adapter.DestWriter for native-destination writes; iox.AtomicWrite is reserved for canonical-source / state / plugin-cache writes"
        # secrets.Resolved.Canonical() is the render-only egress for the resolved
        # apply model. Unwrapping a Resolved to a writable source.Canonical and
        # persisting it would reintroduce the cleartext-secret-into-source leak
        # the type split exists to prevent. Only the adapter Render entry points
        # (and the secrets package's own tests) may call it; the exclusions list
        # below whitelists them. The type wall makes passing a Resolved DIRECTLY
        # to a source writer a compile error; this rule fences the one accessor
        # that could otherwise launder it.
        - pattern: '^secrets\.Resolved\.Canonical$'
          msg: "do not unwrap secrets.Resolved to source.Canonical outside an adapter's Render; persisting it would leak resolved cleartext into ~/.agentsync. Render from the Resolved; capture writes the templated source.Canonical."
        # Direct os.Remove/os.RemoveAll/os.WriteFile/os.Create to a *destination*
        # file bypasses the DestWriter foreign-collision backup invariant, exactly
        # like a direct iox.AtomicWrite (the Adapter.Apply doc bans both). Adapters
        # must route through render.Writer / adapter.DestWriter. The exclusions list
        # below whitelists the legitimate non-destination callers — the DestWriter
        # itself, canonical-source / state / plugin-marketplace-cache / git-backup
        # scaffolding, and all tests — each text-scoped to this rule so it does not
        # also suppress the iox.AtomicWrite / secrets.Resolved.Canonical rules.
        - pattern: '^os\.Remove$'
          msg: "use render.Writer / adapter.DestWriter for native-destination writes; direct os.* is reserved for non-destination (canonical-source / state / cache / git-backup) code"
        - pattern: '^os\.RemoveAll$'
          msg: "use render.Writer / adapter.DestWriter for native-destination writes; direct os.* is reserved for non-destination (canonical-source / state / cache / git-backup) code"
        - pattern: '^os\.WriteFile$'
          msg: "use render.Writer / adapter.DestWriter for native-destination writes; direct os.* is reserved for non-destination (canonical-source / state / cache / git-backup) code"
        - pattern: '^os\.Create$'
          msg: "use render.Writer / adapter.DestWriter for native-destination writes; direct os.* is reserved for non-destination (canonical-source / state / cache / git-backup) code"
  exclusions:
    rules:
      # main.go can use os.UserHomeDir if needed.
      - path: '(^|/)cmd/.*'
        linters: [forbidigo]
      # Whitelisted iox.AtomicWrite callers — these write to canonical
      # source, agentsync's own state, or plugin-cache scratch, none of
      # which are native agent destinations and so don't need the
      # foreign-collision backup. If you need to add a path here, the bar
      # is "this write does NOT target a file the user could plausibly
      # have hand-managed before agentsync was installed."
      #
      # Each is text-scoped to the AtomicWrite rule so it does NOT also
      # suppress the other forbidigo rules (notably secrets.Resolved.Canonical)
      # in these files — a whole-file [forbidigo] exclusion would silently
      # un-fence a future Resolved-unwrap-then-write in e.g. reconcile.go.
      - path: '(^|/)internal/iox/.*'
        linters: [forbidigo]
        text: 'iox\.AtomicWrite is reserved'
      - path: '(^|/)internal/render/writer\.go$'
        linters: [forbidigo]
        text: 'iox\.AtomicWrite is reserved'
      - path: '(^|/)internal/source/writer\.go$'
        linters: [forbidigo]
        text: 'iox\.AtomicWrite is reserved'
      - path: '(^|/)internal/state/store\.go$'
        linters: [forbidigo]
        text: 'iox\.AtomicWrite is reserved'
      # secrets/age.go writes secrets.age under ~/.agentsync/ via the
      # atomic path so a Ctrl-C during re-encrypt can't truncate the file.
      # Same canonical-source category, not a native destination.
      - path: '(^|/)internal/secrets/age\.go$'
        linters: [forbidigo]
        text: 'iox\.AtomicWrite is reserved'
      # CLI files writing to ~/.agentsync/* (canonical source).
      - path: '(^|/)internal/cli/(plugin|marketplace|agent|gitbackup_config|reconcile|update)\.go$'
        linters: [forbidigo]
        text: 'iox\.AtomicWrite is reserved'
      # The PassThroughWriter test helper deliberately delegates to
      # iox.AtomicWrite — that's its whole job.
      - path: '(^|/)internal/adapter/testwriter\.go$'
        linters: [forbidigo]
        text: 'iox\.AtomicWrite is reserved'
      # The secrets package's own tests assert on Resolved.Canonical() output.
      # Test-only, not a leak vector that ships; text-scoped to the rule.
      - path: '(^|/)internal/secrets/.*_test\.go$'
        linters: [forbidigo]
        text: 'unwrap secrets\.Resolved'
      # --- os.* destination-write fence exclusions (issue #163) ---
      # All tests: fixtures write freely to t.TempDir()/afero, never to a real
      # native destination. Text-scoped to the os.* rule only.
      - path: '_test\.go$'
        linters: [forbidigo]
        text: 'direct os\.\* is reserved'
      # The DestWriter itself owns the delete + foreign-collision-backup invariant.
      - path: '(^|/)internal/render/writer\.go$'
        linters: [forbidigo]
        text: 'direct os\.\* is reserved'
      # PassThroughWriter test helper — delegating the delete is its job.
      - path: '(^|/)internal/adapter/testwriter\.go$'
        linters: [forbidigo]
        text: 'direct os\.\* is reserved'
      # iox atomic-write internals (temp-file cleanup) and the local git-backup
      # repo scaffolding + marketplace fetch scratch — all non-destination.
      - path: '(^|/)internal/iox/.*'
        linters: [forbidigo]
        text: 'direct os\.\* is reserved'
      - path: '(^|/)internal/git/.*'
        linters: [forbidigo]
        text: 'direct os\.\* is reserved'
      - path: '(^|/)internal/marketplace/.*'
        linters: [forbidigo]
        text: 'direct os\.\* is reserved'
      # CLI files writing to canonical source (~/.agentsync/*), the vault, the
      # plugin/marketplace cache, or a writability probe — not native destinations.
      - path: '(^|/)internal/cli/(init|secrets|marketplace|plugin|update|mcp|agent|doctor|reconcile)\.go$'
        linters: [forbidigo]
        text: 'direct os\.\* is reserved'
      # BDD/e2e harness code writes fixtures to temp dirs, never a native destination.
      - path: '(^|/)test/.*'
        linters: [forbidigo]
        text: 'direct os\.\* is reserved'

formatters:
  enable:
    - gofumpt
