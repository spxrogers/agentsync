name: ci
# CI runs on PRs (the gate that keeps a red commit from merging) and as a
# reusable workflow called at the top of the release pipeline (release.yml), so a
# release can never publish from a commit that wouldn't pass CI. It deliberately
# does NOT run on `push: branches: [main]`: a PR can't merge while its checks are
# red, so a post-merge run on main only re-proves what the PR already proved —
# wasted compute. The release path re-runs the suite via `workflow_call` exactly
# because there's no longer a merge-to-main run for it to lean on.
on:
  pull_request:
  workflow_call:

# Single source of truth for the Go version: go.mod's `go` directive.
# setup-go reads it via go-version-file below.
env:
  GO_VERSION_FILE: go.mod

jobs:
  # Pure-unit tests across the supported OS matrix. These never touch the
  # filesystem (per internal/testenv.RequireContainer), so they're safe on
  # any host runner and give us cross-platform coverage that the Linux-only
  # container suite below can't.
  test-fast:
    name: test-fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: extractions/setup-just@v3
      - run: just test-fast

  # The release-readiness gate: every FS-touching test layer in one
  # hermetic container run. Linux only — the Containerfile targets
  # linux/amd64 and the container is the hermeticity guarantee.
  test-release:
    name: test-release (hermetic gate)
    runs-on: ubuntu-latest
    # If this job ever fails again with no obvious cause, set
    # `AGENTSYNC_TEST_DEBUG: "1"` here to enable `set -x` tracing in the
    # runner script + entrypoint. Off by default to keep logs readable.
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - run: just test-release

  # Lint = format + tidy + golangci-lint, via the same `just lint` recipe
  # contributors run locally, then a diff guard so an uncommitted format/tidy
  # change fails the build (CI and local can't drift).
  lint:
    name: lint (fmt + tidy + golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: extractions/setup-just@v3
      # golangci-lint is pinned inside the recipe (v2.12.2 via `go run`); its
      # build needs a Go >= our go.mod version to parse this module's export
      # data, which setup-go guarantees.
      - run: just lint
      - name: Verify formatting & go.mod/go.sum are committed
        run: git diff --exit-code
      # Pin the release-version rule (scripts/release-tag.sh) so the v+semver
      # validator both release paths share can't silently rot. Pure bash, no git
      # side effects.
      - name: Pin release-version validation (scripts/release-tag.sh --self-test)
        run: ./scripts/release-tag.sh --self-test
      # GoReleaser renders publisher credential fields (`token`, `private_key`)
      # with the env-only template context (ApplySingleEnvOnly): only bare
      # `{{ .Env.X }}` works there — function calls like envOrDefault/isEnvSet are
      # NOT available and fail ONLY at real publish time (`goreleaser check` and
      # snapshot can't catch it; it broke the v0.7.0 release). Fail fast here.
      - name: Guard against envOrDefault/isEnvSet in goreleaser token/private_key fields
        run: |
          if grep -nE '^[[:space:]]*(token|private_key):.*\{\{.*(envOrDefault|isEnvSet)' .goreleaser.yaml; then
            echo "::error file=.goreleaser.yaml::publisher token/private_key must use a bare {{ .Env.X }} template — envOrDefault/isEnvSet are unavailable in that context and fail at publish"
            exit 1
          fi
      # The goreleaser version is pinned in FOUR places (ci.yml x2, release.yml
      # x1, justfile x1). This is the C3 "dual-list drift" class — assert they
      # never diverge, so the toolchain that validates a release can't differ
      # from the one that ships it (issue #138). The workflow-side pins are
      # anchored to the goreleaser-action steps themselves (the `version:` input
      # inside each `uses: goreleaser/goreleaser-action@…` step's `with:` block)
      # rather than grepping for ANY `version: "N.N.N"` — so a future unrelated
      # action input named `version` can neither satisfy nor miscount this
      # guard, and a goreleaser-action step MISSING its pin fails it too. The
      # version extraction is line-anchored (leading whitespace, then
      # `version:`), so a COMMENT inside a step's lines — a full comment line or
      # a trailing `# version: "N.N.N"` remark — can never satisfy the count or
      # feed a bogus version into the parity comparison.
      - name: Guard goreleaser version pin (CI == release == just)
        run: |
          set -euo pipefail
          wf='.github/workflows/ci.yml .github/workflows/release.yml'
          steps=$(grep -hE '^[[:space:]]*-[[:space:]]*uses:[[:space:]]*goreleaser/goreleaser-action@' $wf | wc -l)
          if [ "$steps" -lt 3 ]; then
            echo "::error::expected >=3 goreleaser-action steps across ci.yml/release.yml (ci.yml x2, release.yml x1); found $steps — the parity guard's anchors moved, update this step"
            exit 1
          fi
          mapfile -t vers < <(
            awk '
              /^[[:space:]]*-[[:space:]]*uses:[[:space:]]*goreleaser\/goreleaser-action@/ { instep=1; next }
              instep && /^[[:space:]]*-[[:space:]]*(name|uses|run):/ { instep=0 }
              instep && match($0, /^[[:space:]]*version:[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"/) {
                v=substr($0, RSTART, RLENGTH); gsub(/[^0-9.]/, "", v); print v; instep=0
              }
            ' $wf
            grep -hoE 'goreleaser/v2@v[0-9]+\.[0-9]+\.[0-9]+' justfile | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
          )
          if [ "${#vers[@]}" -ne "$((steps + 1))" ]; then
            echo "::error::found $steps goreleaser-action step(s) plus the justfile pin, but ${#vers[@]} version pin(s) (${vers[*]:-none}) — every goreleaser-action step must carry a quoted version: pin and the justfile go-run pin must be present"
            exit 1
          fi
          if [ "$(printf '%s\n' "${vers[@]}" | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::goreleaser version pins disagree across ci.yml / release.yml / justfile: ${vers[*]}"
            exit 1
          fi
          echo "goreleaser pinned consistently to ${vers[0]} across $steps goreleaser-action step(s) + justfile"
      # The nfpms file_name_template is version-less specifically so the README's
      # releases/latest/download/ URLs resolve. Assert the coupling so a change to
      # either side fails CI instead of silently 404ing the install command (#138).
      - name: Guard nfpms file_name_template matches README install URLs
        run: |
          set -euo pipefail
          proj=$(grep -oE '^project_name:[[:space:]]*[A-Za-z0-9_-]+' .goreleaser.yaml | awk '{print $2}')
          # The template must stay the version-less {ProjectName}_{Os}_{Arch}{ext} shape.
          if ! grep -qE 'file_name_template:.*\.ProjectName.*_.*\.Os.*_.*\.Arch.*\.ConventionalExtension' .goreleaser.yaml; then
            echo "::error file=.goreleaser.yaml::nfpms file_name_template no longer produces the version-less {ProjectName}_{Os}_{Arch}{ext} shape the README latest/download URLs depend on"
            exit 1
          fi
          fails=0
          # Every deb/rpm the README links via releases/latest/download must match that shape.
          while IFS= read -r fname; do
            [ -z "$fname" ] && continue
            if ! printf '%s' "$fname" | grep -qE "^${proj}_linux_(amd64|arm64)\.(deb|rpm)$"; then
              echo "::error file=README.md::install URL '$fname' does not match nfpms file_name_template '${proj}_{Os}_{Arch}{.deb|.rpm}'"
              fails=1
            fi
          done < <(grep -oE 'releases/latest/download/[^ )"]+\.(deb|rpm)' README.md | sed 's#.*/##' | sort -u)
          exit $fails

  # The website's link/anchor checker otherwise runs only at deploy time
  # (docs-publish's `bun run build` triggers the prebuild hook), so a broken
  # in-site link would merge cleanly and only fail when the site is next
  # published. Run the checker here on every PR instead: regenerate the
  # mirrored contract pages first (check-links validates the generated +
  # authored pages together — see website/scripts/sync-docs.mjs), then the
  # checker, then its own unit tests. Uses the same bun runtime docs-publish
  # uses; no Astro build — the checker is deliberately standalone (node
  # builtins + github-slugger). The checker also fails on a stale ALLOWLIST
  # entry (one that matched zero violations), so dead exceptions are caught
  # here too.
  docs-links:
    name: docs-links (website link checker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run sync:docs
      - run: bun run check:links
      # failglob: zero matches is a SHELL error, closing the hollow-out both
      # ways — an unquoted pattern reaching node would otherwise be globbed by
      # node itself (>=22) and exit 0 with "# tests 0", and `bun run test`'s
      # quoted glob does the same. globstar matches package.json's recursive
      # "scripts/**/*.test.mjs" so a future nested test file runs here too.
      - run: |
          shopt -s failglob globstar
          node --test scripts/**/*.test.mjs

  goreleaser-snapshot:
    name: goreleaser-snapshot (cross-build matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned to match the publish job (release.yml) and `just ci` so the
          # config is validated by the exact goreleaser that ships it — the
          # version-parity guard in the lint job enforces this (issue #138).
          version: "2.16.0"
          # Validate the ENTIRE .goreleaser.yaml first — including the
          # publish-phase scoop/chocolatey blocks the snapshot below skips — so a
          # schema/template typo fails CI in ~1s instead of mid-release at tag-cut
          # (and can't silently break the existing homebrew/deb/rpm path). Needs
          # no secrets or Windows.
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "2.16.0"
          # --skip publish already skips the (publish-phase) scoop/chocolatey
          # pipes; chocolatey AND sign are also named explicitly because their
          # steps shell out to CLIs this CI runner does not install — `choco`
          # (release sets it up under Mono) and `cosign` (release installs it via
          # sigstore/cosign-installer for the keyless checksum signature, #138).
          # The snapshot runs on every commit, and it signs by default; skipping
          # sign here keeps CI cosign-free while `goreleaser check` above still
          # validates the signs: block's schema. CI only proves the cross-build
          # stays viable — release.yml is the run that actually signs.
          args: release --snapshot --skip=publish,chocolatey,sign --clean
